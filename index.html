<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Checker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h1>Password Strength Checker</h1>
        <p class="subtitle">Type A Password To See How Strong It Is!</p>

        <div class="input-wrapper">
            <input type="password" id="passwordInput" placeholder="Enter A Password." oninput="checkPassword(this.value)">
            <button class="toggle-btn" onclick="toggleVisibility()" aria-label="Press this button to see the password">👁️</button>
        </div>

        <div class="strength-bar">
            <div class="segment" id="seg1"></div>
            <div class="segment" id="seg2"></div>
            <div class="segment" id="seg3"></div>
            <div class="segment" id="seg4"></div>
        </div>

        <div class="strength-info">
            <span id="strengthLabel">Enter Password To Begin</span>
            <span id="scoreDisplay"></span>
        </div>

        <hr class="divider">

        <p class="criteria-title">Criteria</p>
        <div class="criteria-list" id="criteriaList"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
